<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 480" width="270" height="480">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="270" height="480" rx="8" fill="url(#g)"/>
  <!-- glow orb -->
  <circle cx="135" cy="200" r="90" fill="#facc15" opacity="0.10"/>
  <!-- accent top bar -->
  <rect x="12" y="12" width="80" height="3" rx="2" fill="#facc15" opacity="0.7"/>
  <!-- template id label -->
  <text x="135" y="180" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#facc15" text-anchor="middle" opacity="0.9">Captions — Bold Ki</text>
  <!-- scene count -->
  <text x="135" y="240" font-family="sans-serif" font-size="40" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">1</text>
  <text x="135" y="270" font-family="sans-serif" font-size="12"
        fill="white" text-anchor="middle" opacity="0.5">scene</text>
  <!-- scene timeline strip -->
  <rect x="8" y="444" width="252" height="24" rx="4" fill="#7ef2bc" opacity="0.85"/>
  <!-- border -->
  <rect width="270" height="480" rx="8" fill="none" stroke="#facc15" stroke-width="1" opacity="0.25"/>
</svg>
