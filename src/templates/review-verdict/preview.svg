<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 480" width="270" height="480">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0805"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="270" height="480" rx="8" fill="url(#g)"/>
  <!-- glow orb -->
  <circle cx="135" cy="200" r="90" fill="#f59e0b" opacity="0.10"/>
  <!-- accent top bar -->
  <rect x="12" y="12" width="80" height="3" rx="2" fill="#f59e0b" opacity="0.7"/>
  <!-- template id label -->
  <text x="135" y="180" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#f59e0b" text-anchor="middle" opacity="0.9">Product Review — ت</text>
  <!-- scene count -->
  <text x="135" y="240" font-family="sans-serif" font-size="40" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">4</text>
  <text x="135" y="270" font-family="sans-serif" font-size="12"
        fill="white" text-anchor="middle" opacity="0.5">scenes</text>
  <!-- scene timeline strip -->
  <rect x="8" y="444" width="48" height="24" rx="4" fill="#7ef2bc" opacity="0.85"/><rect x="58" y="444" width="65" height="24" rx="4" fill="#a78bfa" opacity="0.85"/><rect x="126" y="444" width="57" height="24" rx="4" fill="#fbbf24" opacity="0.85"/><rect x="185" y="444" width="74" height="24" rx="4" fill="#60a5fa" opacity="0.85"/>
  <!-- border -->
  <rect width="270" height="480" rx="8" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.25"/>
</svg>
